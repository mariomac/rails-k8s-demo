default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "tapas-db" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  database: <%= ENV.fetch("POSTGRES_DB") { "tapas" } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "tapas" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "tapas_password" } %>

production:
  <<: *default
