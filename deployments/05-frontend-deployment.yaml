apiVersion: apps/v1
kind: Deployment
metadata:
  name: tapas-frontend
  namespace: tapas
  labels:
    app: tapas-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tapas-frontend
  template:
    metadata:
      labels:
        app: tapas-frontend
    spec:
      containers:
        - name: frontend
          image: tapas-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://tapas-backend:3000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tapas-frontend
  namespace: tapas
  labels:
    app: tapas-frontend
spec:
  type: NodePort
  selector:
    app: tapas-frontend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
